# @package _global_
experiment_name: liu2024_within_subject_smoke
# Full experiment preset: real Liu2024 data + dataset-specific preprocessing.
defaults:
  - override /dataset: liu2024_subject1
  - override /preprocessing: liu2024
  - override /training: default
  - override /model: eegnet

dataset:
  subject_ids:
    - 3
  split:
    method: train_test
    # train_test, train_valid_test, cross_validation_test, grid_search_test
    test_size: 0.2
    stratify: true
    validation:
      valid_size: 0.2
      shuffle: false
    resampling:
      method: holdout # kfold or holdout
      n_splits: 5
      shuffle: false

training:
  max_epochs: 2
  batch_size: 16
  learning_rate: 0.000625
  weight_decay: 0.0
