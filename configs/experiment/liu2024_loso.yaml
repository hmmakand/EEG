# @package _global_
experiment_name: liu2024_loso
# Leave-one-subject-out preset (full-data / canonical LOSO): train on ALL
# windows of every non-held-out subject and evaluate on ALL windows of the
# held-out subject. The chronological source is not used to subset subjects
# inside a fold.
defaults:
  - override /dataset: liu2024
  - override /preprocessing: liu2024
  - override /training: default
  - override /model: eegnet

dataset:
  split:
    method: leave_one_subject_out

training:
  max_epochs: 2
  batch_size: 16
  learning_rate: 0.000625
  weight_decay: 0.0
  validation:
    enabled: false # if true will creare (train+val) & test
