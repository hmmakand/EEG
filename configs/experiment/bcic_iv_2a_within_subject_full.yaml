# @package _global_
experiment_name: bcic_iv_2a_within_subject_full
# Full experiment preset: real BCI IV 2a data + dataset-specific preprocessing.
defaults:
  - override /dataset: bcic_iv_2a
  - override /preprocessing: bcic_iv_2a
  - override /training: default
  - override /model: eegnet

dataset:
  split:
    method: train_test
    # train_test, train_valid_test, cross_validation_test, grid_search_test
    validation:
      valid_size: 0.2
      shuffle: false
    resampling:
      method: holdout # kfold or holdout
      n_splits: 5
      valid_size: 0.2
      shuffle: false

training:
  max_epochs: 3
  batch_size: 16
  learning_rate: 0.000625
  weight_decay: 0.0

# param_grid:
#     optimizer__lr: 0.000625
