# @package _global_
experiment_name: bcic_iv_2a_loso
# Leave-one-subject-out preset (full-data / canonical LOSO): train on ALL
# windows of every non-held-out subject (both 0train and 1test sessions) and
# evaluate on ALL windows of the held-out subject. The session source is not
# used to subset subjects inside a fold; the session keys below only label the
# run and are harmless for LOSO.
defaults:
  - override /dataset: bcic_iv_2a
  - override /preprocessing: bcic_iv_2a
  - override /training: default
  - override /model: eegnet

dataset:
  split:
    method: leave_one_subject_out

training:
  max_epochs: 2
  batch_size: 16
  learning_rate: 0.000625
  weight_decay: 0.0
  validation:
    enabled: false # if true will creare (train+val) & test
